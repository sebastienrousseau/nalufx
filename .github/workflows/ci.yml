# Unified CI Pipeline
# Uses reusable workflows from sebastienrousseau/pipelines
# Replaces: audit.yml, check.yml, lint.yml, test.yml, coverage.yml

name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
      - "feat/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; a job that needs more says so.
permissions:
  contents: read

jobs:
  # Runs in-repo rather than via sebastienrousseau/pipelines' rust-ci.yml.
  # It moved here because Slint (in the since-removed nalufx-ui) needed
  # fontconfig headers that the shared workflow cannot install. That
  # reason is gone; moving back to the shared workflow is its own change.
  ci:
    name: Rust CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-deps --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Docs
        run: cargo doc --no-deps --all-features --workspace

  # Per-function and per-file complexity ceilings (~/Code/AGENTS.md
  # section 0), held against the committed baseline in
  # scripts/complexity-baseline.json: no new offenders, and no
  # baselined offender may get worse.
  complexity:
    name: Complexity ceilings
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version the baseline was measured with; bump both together.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: rust-code-analysis-cli@0.0.25
      - run: scripts/complexity-gate.py

  # The M2 performance budget: a 20-asset, 250-day allocation in under
  # 50 ms at p95, for every method, in an optimised build on the runner.
  # The benchmarks are compiled too, so they cannot rot.
  performance:
    name: Performance budget
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Allocation p95 under 50 ms
        env:
          NALUFX_PERF: "1"
        run: cargo test --release -p nalufx-engine --test perf -- --nocapture

      - name: Benchmarks compile
        run: cargo bench -p nalufx-engine --no-run

  # Line coverage gates from the 10/10 plan: nalufx-engine and
  # nalufx-llms at least 90%, the workspace at least 80%. Property tests run fewer cases here; the
  # Rust CI job runs them in full.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PROPTEST_CASES: "200"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: nalufx-engine at least 90% of lines
        # Each step starts from an empty coverage build: llvm-cov reports every
        # instrumented binary it finds, so objects from an earlier step (or a
        # restored cache) with other features add counters that never ran.
        run: rm -rf target/llvm-cov-target && cargo llvm-cov -p nalufx-engine --all-features --summary-only --fail-under-lines 90

      - name: nalufx-llms at least 90% of lines
        run: rm -rf target/llvm-cov-target && cargo llvm-cov -p nalufx-llms --all-features --summary-only --fail-under-lines 90

      - name: nalufx-api at least 85% of lines
        run: rm -rf target/llvm-cov-target && cargo llvm-cov -p nalufx-api --all-features --summary-only --fail-under-lines 85

      - name: nalufx-cli at least 80% of lines
        run: rm -rf target/llvm-cov-target && cargo llvm-cov -p nalufx-cli --all-features --summary-only --fail-under-lines 80

      - name: Workspace at least 80% of lines
        run: rm -rf target/llvm-cov-target && cargo llvm-cov --workspace --all-features --summary-only --fail-under-lines 80

  # The API contract: the committed openapi.json is exercised by
  # Schemathesis against a release build (backed by a stub language
  # model), and no generated request may get a 5xx. The drift check that
  # openapi.json matches the code is a test in the Rust CI job.
  schemathesis:
    name: API contract (Schemathesis)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: No 5xx on any generated request
        run: scripts/schemathesis.sh

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      # cargo-audit is run directly rather than through
      # rustsec/audit-check. That action failed here with
      # "I/O operation failed: entity not found" followed by "Unexpected
      # end of JSON input" — it produced no output for its own parser to
      # read, and gave nothing further to diagnose from. Installing and
      # running the tool keeps the failure legible: cargo-audit prints
      # the advisory it tripped on.
      #
      # There is no ignore list: with Slint and chrono gone, the tree
      # has no advisory left to accept. Should one ever be needed it
      # goes in .cargo/audit.toml, which cargo-audit and the shared
      # security workflow both read, not into workflow inputs.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit --deny warnings

  # Blocking, unlike the shared security workflow below, which runs
  # cargo deny with continue-on-error: a licence or source that
  # deny.toml does not allow fails the build here.
  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: cargo deny
        run: cargo deny check

  # Every crate in the tree must be audited, by us or by a trusted
  # organisation whose audits are imported in supply-chain/config.toml,
  # or be in its exemptions. A new dependency fails here until someone
  # reviews it. --locked uses supply-chain/imports.lock, with no fetch.
  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Install cargo-vet
        run: cargo install cargo-vet --version 0.10.3 --locked

      - name: cargo vet
        run: cargo vet --locked

  # Secrets in any commit of the history (on push) or of the pull
  # request. GitHub secret scanning with push protection is also on;
  # this catches what its provider patterns do not.
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  # The shared security workflow, as the other crates in the family
  # call it: cargo audit --deny warnings (it reads .cargo/audit.toml),
  # cargo deny check against deny.toml, CodeQL and, on pull requests,
  # dependency review. That workflow reports cargo deny without failing
  # on it (continue-on-error).
  security:
    permissions:
      contents: read
      security-events: write
    uses: sebastienrousseau/pipelines/.github/workflows/security.yml@3f9978aba68e59da1bd5a58d12fbaf142679fe5f # main 2026-10-13
    with:
      language: rust

  # Nightly toolchain tests (optional, continue on error)
  test-nightly:
    name: Test (nightly)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run tests
        run: cargo test --all-features
