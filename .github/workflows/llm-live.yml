# Nightly, opt-in: the nalufx-llms live tests against the real providers.
# Nothing else calls a provider. A provider runs only when its key and
# model are set as repository secrets; otherwise its test skips.
name: LLM live

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Live provider reports
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      NALUFX_LIVE_ANTHROPIC_MODEL: ${{ secrets.NALUFX_LIVE_ANTHROPIC_MODEL }}
      NALUFX_LIVE_GEMINI_MODEL: ${{ secrets.NALUFX_LIVE_GEMINI_MODEL }}
      NALUFX_LIVE_OPENAI_MODEL: ${{ secrets.NALUFX_LIVE_OPENAI_MODEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Live tests
        run: cargo test -p nalufx-llms --test live -- --ignored --nocapture
