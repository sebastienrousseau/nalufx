name: 🧪 Release

# Releases are cut by pushing a version tag. This workflow used to run on
# every push to a branch, which meant a full build matrix per commit.
#
# Nothing here publishes to crates.io. nalufx is an application, not a
# library: every member sets `publish = false`, and none of the crates
# has ever been published. See issue #40.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the GitHub release"
        type: boolean
        default: false

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Resolve the workspace version and check it against the tag. Unlike
  # the single-crate repositories there is no root package here, so the
  # version comes from [workspace.package].
  guard:
    name: ❯ Verify 🔍
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Resolve version and check against tag
        id: resolve
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[].version] | unique | .[]')
          if [ "$(printf '%s\n' "${version}" | wc -l)" -ne 1 ]; then
            echo "::error::workspace members disagree on version:"
            echo "${version}"
            exit 1
          fi
          echo "workspace version: ${version}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "${tag}" != "${version}" ]; then
              echo "::error::tag v${tag} does not match workspace version ${version}"
              exit 1
            fi
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: ❯ Build 🛠
    needs: guard
    env:
      BUILD_ID: ${{ github.run_id }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OS: ${{ matrix.platform.os }}
      TARGET: ${{ matrix.platform.target }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout sources
        id: checkout
        uses: actions/checkout@v7

      - name: Install stable toolchain
        id: install-toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        id: cache-dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install target
        id: install-target
        run: rustup target add ${{ env.TARGET }}

      # nalufx-ui pulls slint, whose yeslogic-fontconfig-sys build script
      # shells out to pkg-config and panics if fontconfig is absent:
      #
      #   pkg-config exited with status code 1
      #   The system library `fontconfig` required by crate
      #   `yeslogic-fontconfig-sys` was not found.
      #
      # ubuntu-latest does not ship the -dev packages, so the Linux leg of
      # this matrix has never built. The others are unaffected.
      - name: Install Linux system dependencies
        id: install-linux-deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxcb1-dev

      - name: Build targets
        id: build-targets
        run: cargo build --verbose --workspace --release --target "$TARGET"
        shell: bash

      - name: Package the binary
        id: package-binary
        run: |
          mkdir -p target/package
          tar czf target/package/${{ env.TARGET }}.tar.gz -C target/${{ env.TARGET }}/release .
          echo "${{ env.TARGET }}.tar.gz=target/package/${{ env.TARGET }}.tar.gz" >> $GITHUB_ENV

      - name: Upload the binary
        id: upload-binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.TARGET }}.tar.gz
          path: target/package/${{ env.TARGET }}.tar.gz

  release:
    name: ❯ Release 🚀
    if: github.event_name == 'push' || inputs.publish
    needs: [guard, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Update version number
        run: |
          NEW_VERSION=$(grep version Cargo.toml | sed -n 2p | cut -d '"' -f 2)
          echo "VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
        shell: /bin/bash -e {0}

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Pull down every artifact the build matrix uploaded.
      # merge-multiple flattens them into one directory rather than one
      # folder per artifact.
      #
      # The previous implementation curl'd
      # `actions/runs/${BUILD_ID}/artifacts/${name}` -- but neither
      # BUILD_ID nor TARGET is set in this job, so the loop iterated over
      # an empty list and, when it did run, wrote an unauthenticated API
      # error body into a .tar.gz. No release ever carried real binaries.
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # gh is preinstalled on the runner, so this replaces the archived
      # actions/create-release@v1 without adding a third-party dependency.
      # The version comes from the guard job, which reads it from
      # [workspace.package] rather than
      # `grep version Cargo.toml | sed -n 2p` -- that picked the second
      # line matching "version" anywhere in the manifest.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "NaluFX 🦀 v${VERSION}" \
            --generate-notes \
            --draft \
            dist/*.tar.gz dist/SHA256SUMS
