name: 🧪 Release

# Releases are cut by pushing a version tag. This workflow used to run on
# every push to a branch, which meant a full build matrix per commit.
#
# Nothing here publishes to crates.io. nalufx is an application, not a
# library: every member sets `publish = false`, and none of the crates
# has ever been published. See issue #40.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # A change to this file builds every target before it can reach a
  # tag; the release job itself runs only for a tag or a manual publish.
  pull_request:
    paths:
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the GitHub release"
        type: boolean
        default: false

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the release job writes, and it also signs
# the build provenance.
permissions:
  contents: read

jobs:
  # Resolve the workspace version and check it against the tag. Unlike
  # the single-crate repositories there is no root package here, so the
  # version comes from [workspace.package].
  guard:
    name: ❯ Verify 🔍
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version and check against tag
        id: resolve
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[].version] | unique | .[]')
          if [ "$(printf '%s\n' "${version}" | wc -l)" -ne 1 ]; then
            echo "::error::workspace members disagree on version:"
            echo "${version}"
            exit 1
          fi
          echo "workspace version: ${version}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "${tag}" != "${version}" ]; then
              echo "::error::tag v${tag} does not match workspace version ${version}"
              exit 1
            fi
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: ❯ Build 🛠
    needs: guard
    # Bash on every runner: Windows defaults to PowerShell, where
    # "$TARGET" is an empty PowerShell variable, not the environment
    # variable. That emptied `rustup target add` and failed v0.0.10.
    defaults:
      run:
        shell: bash
    env:
      BUILD_ID: ${{ github.run_id }}
      OS: ${{ matrix.platform.os }}
      TARGET: ${{ matrix.platform.target }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout sources
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        id: install-toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache dependencies
        id: cache-dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install target
        id: install-target
        run: rustup target add "$TARGET"

      - name: Build targets
        id: build-targets
        run: cargo build --verbose --workspace --release --target "$TARGET"
        shell: bash

      - name: Package the binary
        id: package-binary
        run: |
          mkdir -p target/package
          tar czf "target/package/${TARGET}.tar.gz" -C "target/${TARGET}/release" .
          echo "${TARGET}.tar.gz=target/package/${TARGET}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload the binary
        id: upload-binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.TARGET }}.tar.gz
          path: target/package/${{ env.TARGET }}.tar.gz

  release:
    name: ❯ Release 🚀
    if: github.event_name == 'push' || inputs.publish
    needs: [guard, build]
    runs-on: ubuntu-latest
    permissions:
      # Creates the draft release.
      contents: write
      # Signs and stores the build provenance (Sigstore through GitHub).
      id-token: write
      attestations: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Update version number
        run: |
          NEW_VERSION=$(grep version Cargo.toml | sed -n 2p | cut -d '"' -f 2)
          echo "VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
        shell: /bin/bash -e {0}

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Pull down every artifact the build matrix uploaded.
      # merge-multiple flattens them into one directory rather than one
      # folder per artifact.
      #
      # The previous implementation curl'd
      # `actions/runs/${BUILD_ID}/artifacts/${name}` -- but neither
      # BUILD_ID nor TARGET is set in this job, so the loop iterated over
      # an empty list and, when it did run, wrote an unauthenticated API
      # error body into a .tar.gz. No release ever carried real binaries.
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # A CycloneDX SBOM for each binary: every crate it is built from,
      # with its version, package URL and licence.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Generate SBOMs
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --spec-version 1.5 --describe binaries
          mv nalufx-cli/nalufx_bin.cdx.json dist/nalufx.cdx.json
          mv nalufx-api/nalufx-api_bin.cdx.json dist/nalufx-api.cdx.json

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz ./*.cdx.json > SHA256SUMS
          cat SHA256SUMS

      # SLSA build provenance for every archive and SBOM: a signed
      # statement of the workflow, commit and runner that produced each
      # one. Anyone can check it with `gh attestation verify`.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.cdx.json

      # The signed attestation is also attached to the release, so it can
      # be checked offline and OpenSSF Scorecard finds it: the Sigstore
      # bundle (an in-toto SLSA statement in a DSSE envelope), compacted
      # to one JSON line.
      - name: Attach the provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          jq -c . "$BUNDLE" > "dist/nalufx-v${VERSION}.intoto.jsonl"
          test "$(wc -l < "dist/nalufx-v${VERSION}.intoto.jsonl")" -eq 1

      - name: Verify the provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          for f in dist/*.tar.gz dist/*.cdx.json; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY"
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --bundle "dist/nalufx-v${VERSION}.intoto.jsonl"
          done

      # gh is preinstalled on the runner, so this replaces the archived
      # actions/create-release@v1 without adding a third-party dependency.
      # The version comes from the guard job, which reads it from
      # [workspace.package] rather than
      # `grep version Cargo.toml | sed -n 2p` -- that picked the second
      # line matching "version" anywhere in the manifest.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "NaluFX 🦀 v${VERSION}" \
            --generate-notes \
            --draft \
            dist/*.tar.gz dist/*.cdx.json dist/*.intoto.jsonl dist/SHA256SUMS
