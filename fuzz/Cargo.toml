# Fuzz targets, run with cargo-fuzz on a nightly toolchain:
#
#   cargo +nightly fuzz run csv_returns
#
# A separate workspace, so the main one never builds libFuzzer.
[package]
name = "nalufx-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
axum = "0.8"
libfuzzer-sys = "0.4"
nalufx-api = { path = "../nalufx-api" }
nalufx-cli = { path = "../nalufx-cli" }
nalufx-engine = { path = "../nalufx-engine" }
nalufx-llms = { path = "../nalufx-llms" }
ndarray = "0.17.2"
serde_json = "1.0.120"
tokio = { version = "1.44", features = ["rt"] }

[[bin]]
name = "csv_returns"
path = "fuzz_targets/csv_returns.rs"
test = false
doc = false
bench = false

[[bin]]
name = "api_requests"
path = "fuzz_targets/api_requests.rs"
test = false
doc = false
bench = false

[[bin]]
name = "allocate"
path = "fuzz_targets/allocate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "report_text"
path = "fuzz_targets/report_text.rs"
test = false
doc = false
bench = false
